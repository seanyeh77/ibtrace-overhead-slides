name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - run: npm ci
      - run: npx slidev build --base /ibtrace-overhead-slides/ --out dist
      - run: npx slidev build attribution.md --base /ibtrace-overhead-slides/attribution/ --out dist/attribution
      - run: npx slidev build extension.md --base /ibtrace-overhead-slides/extension/ --out dist/extension
      - run: npx slidev build final.md --base /ibtrace-overhead-slides/final/ --out dist/final
      - run: npx slidev build validation.md --base /ibtrace-overhead-slides/validation/ --out dist/validation
      - run: node ../.github/scripts/slides-manifest.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SLIDES_PAT: ${{ secrets.SLIDES_PAT }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Rebuild slides index
        if: env.SLIDES_PAT != ''
        env:
          GH_TOKEN: ${{ env.SLIDES_PAT }}
        run: gh api repos/seanyeh77/seanyeh77.github.io/dispatches -f event_type=slides-updated
